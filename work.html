<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Selected game design and illustration work by Graaf." />
    <title>Selected work — Graaf</title>
    <link rel="icon" href="/assets/favicon-graaf.png" type="image/png" />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="preload" as="image" href="/assets/work-center-1280.webp" imagesrcset="/assets/work-center-480.webp 480w, /assets/work-center-960.webp 960w, /assets/work-center-1280.webp 1280w, /assets/work-center-1920.webp 1920w, /assets/work-center-2400.webp 2400w" imagesizes="(max-width: 1213px) calc(100vw - 40px), 1173px" fetchpriority="high" />
    <script src="/media.js" defer></script>
  </head>
  <body>
    <main class="work-page" aria-label="Selected work">
      <div class="work-gallery">
        <div class="gallery-panel gallery-panel-first">
          <img src="/assets/work-center-1280.webp" srcset="/assets/work-center-480.webp 480w, /assets/work-center-960.webp 960w, /assets/work-center-1280.webp 1280w, /assets/work-center-1920.webp 1920w, /assets/work-center-2400.webp 2400w" sizes="(max-width: 1213px) calc(100vw - 40px), 1173px" decoding="sync" alt="Illustrated character holding a slot machine" width="3840" height="2160" fetchpriority="high" />
        </div>
        <div class="gallery-panel">
          <img src="/assets/work-left-1280.webp" srcset="/assets/work-left-480.webp 480w, /assets/work-left-960.webp 960w, /assets/work-left-1280.webp 1280w, /assets/work-left-1920.webp 1920w, /assets/work-left-2400.webp 2400w" sizes="(max-width: 1213px) calc(100vw - 40px), 1173px" decoding="async" alt="Theft slot game with illustrated characters in a neon city" width="3840" height="2160" loading="lazy" />
        </div>
        <div class="gallery-panel">
          <img src="/assets/work-left-1280.webp" srcset="/assets/work-left-480.webp 480w, /assets/work-left-960.webp 960w, /assets/work-left-1280.webp 1280w, /assets/work-left-1920.webp 1920w, /assets/work-left-2400.webp 2400w" sizes="(max-width: 1213px) calc(100vw - 40px), 1173px" decoding="async" alt="" aria-hidden="true" width="3840" height="2160" loading="lazy" />
          <img src="/assets/work-right-1280.webp" srcset="/assets/work-right-480.webp 480w, /assets/work-right-960.webp 960w, /assets/work-right-1280.webp 1280w, /assets/work-right-1920.webp 1920w, /assets/work-right-2400.webp 2400w" sizes="(max-width: 1213px) calc(100vw - 40px), 1173px" decoding="async" alt="Tropical jungle slot game with carved stone symbols" width="3840" height="2160" loading="lazy" />
        </div>
        <div class="gallery-characters">
          <div class="character-panel">
            <div class="character-vector">
              <img src="/assets/gallery-character-vector.svg" alt="Game show host in a pink suit and gold sunglasses" loading="lazy" />
            </div>
          </div>
          <div class="character-panel">
            <img class="character-render" src="/assets/gallery-character-render-384.webp" srcset="/assets/gallery-character-render-384.webp 384w, /assets/gallery-character-render-768.webp 768w" sizes="(max-width: 1213px) 33vw, 377px" decoding="async" alt="Game show host in a pink suit holding a microphone" width="1024" height="1535" loading="lazy" />
          </div>
        </div>
      </div>
    </main>
    <a class="work-close" href="/" aria-label="Close work and return home">
      <img src="/assets/gallery-close.svg" alt="" />
    </a>
  </body>
</html>
